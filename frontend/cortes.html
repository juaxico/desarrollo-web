        <!-- Mantener esta clase: auth.js añade aquí el acceso o el usuario. -->

</header>

            data-categorias="vacuno,parrillada,pollo,pavo"
        >
            <noscript><p class="descripcion-categoria">Activa JavaScript para ver el catálogo.</p></noscript>
        </div>

            </p>

    <script src="./assets/js/catalogo.js"></script>


    <!-- ====================================== -->
    <!-- HEADER STICKY + LÍNEA AL HACER SCROLL -->
    <!-- ====================================== -->

    <script>

        const header =
            document.getElementById(
                "headerPrincipal"
            );


        function actualizarHeader() {

            if (window.scrollY > 40) {

                header.classList.add(
                    "header-scroll"
                );

            } else {

                header.classList.remove(
                    "header-scroll"
                );

            }

        }


        window.addEventListener(
            "scroll",
            actualizarHeader
        );


        actualizarHeader();

    </script>


    <script src="./assets/js/menu-responsive.js"></script>
