<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PEDIDO - El Asador</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet"
    >


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="./assets/css/estilos.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header class="encabezado">


        <div class="logo">
            EL ASADOR
        </div>


        <nav class="menu-navegacion">

            <a href="index.html">
                INICIO
            </a>

            <span>|</span>

            <a href="cortes.html">
                CORTES
            </a>

            <span>|</span>

            <a href="parrillas.html">
                PARRILLAS
            </a>

            <span>|</span>

            <a href="index.html#nosotros">
                LA CASA
            </a>

        </nav>


        <div class="acciones-header">

            <a
                href="pedido.html"
                class="btn btn-outline-light"
            >
                🛒 PEDIDO
                (<span id="contador-pedido">0</span>)
            </a>


            <button
                type="button"
                class="btn btn-outline-danger"
                data-bs-toggle="modal"
                data-bs-target="#myModal"
            >
                Acceder
            </button>

        </div>

    </header>



    <!-- CONTENIDO -->

    <main class="container py-5">

        <h1 class="text-center mb-5">
            Mi Pedido
        </h1>


        <div class="row">


            <!-- PRODUCTOS -->

            <div class="col-lg-8">

                <div id="lista-pedido">
                </div>


                <button
                    class="btn btn-outline-danger mt-3"
                    onclick="vaciarPedido()"
                >
                    Vaciar Pedido
                </button>

            </div>



            <!-- RESUMEN -->

            <div class="col-lg-4">

                <div class="card p-4">

                    <h3 class="mb-4">
                        Resumen
                    </h3>


                    <div class="d-flex justify-content-between">

                        <span>
                            Subtotal:
                        </span>

                        <strong id="subtotal-Pedido">
                            $0
                        </strong>

                    </div>


                    <hr>


                    <div class="d-flex justify-content-between fs-4">

                        <span>
                            Total:
                        </span>

                        <strong
                            class="text-danger"
                            id="total-pedido"
                        >
                            $0
                        </strong>

                    </div>


                    <button
                        class="btn btn-danger mt-4 w-100"
                    >
                        Finalizar compra
                    </button>


                    <a
                        href="cortes.html"
                        class="btn btn-outline-light mt-3 w-100"
                    >
                        Seguir comprando
                    </a>

                </div>

            </div>

        </div>

    </main>



    <!-- FOOTER -->

    <footer class="pie-pagina">

        <div>

            <h2>
                Ubicación
            </h2>

            <p>
                Av. Ejemplo 1234, Santiago
            </p>

        </div>


        <div>

            <h2>
                Contacto
            </h2>

            <p>
                +56 9 1234 5678
            </p>

            <p>
                elasador2026@gmail.com
            </p>

        </div>


        <div>

            <h2>
                Redes sociales
            </h2>

            <p>
                Instagram
            </p>

            <p>
                Facebook
            </p>

        </div>

    </footer>



    <!-- MODAL -->

    <div
        class="modal fade"
        id="myModal"
        tabindex="-1"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Acceder
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    >
                    </button>

                </div>


                <div class="modal-body">

                    <form>

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Iniciar sesión
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>



    <script src="./assets/js/pedido.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    >
    </script>


</body>

</html>
