<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pedido - El Asador</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet"
    >


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="./assets/css/estilos.css"
    >

</head>


<body>


    <!-- ====================================== -->
    <!-- HEADER -->
    <!-- ====================================== -->

    <header
        class="encabezado encabezado-interno"
        id="headerPrincipal"
    >

        <div class="logo">

            <a href="index.html">

                <img
                    src="./assets/imagenes_productos/logo minimalista.png"
                    alt="Logo El Asador"
                    class="logo-imagen"
                >

            </a>

        </div>


        <nav class="menu-navegacion">

            <a href="index.html">
                INICIO
            </a>

            <span>|</span>

            <a href="cortes.html">
                CORTES
            </a>

            <span>|</span>

            <a href="parrillas.html">
                PARRILLAS
            </a>

            <span>|</span>

            <a href="index.html#nosotros">
                LA CASA
            </a>

        </nav>


        <div class="acciones-header">

            <a
                href="pedido.html"
                class="btn btn-outline-light"
            >
                🛒 Pedido
                (<span id="contador-pedido">0</span>)
            </a>


            <button
                type="button"
                class="btn btn-outline-danger"
                data-bs-toggle="modal"
                data-bs-target="#myModal"
            >
                Acceder
            </button>

        </div>

    </header>



    <!-- ====================================== -->
    <!-- PEDIDO -->
    <!-- ====================================== -->

    <main class="seccion pedido-contenedor">

        <h1 class="titulo-seccion">
            Tu Pedido
        </h1>


        <div id="lista-pedido">
        </div>


        <div class="resumen-pedido">

            <p>
                Subtotal:

                <strong id="subtotal-pedido">
                    $0
                </strong>
            </p>


            <hr>


            <p class="total-pedido">
                Total:

                <strong id="total-pedido">
                    $0
                </strong>
            </p>


            <!-- DATOS DE DESPACHO -->

            <form
                id="form-despacho"
                class="form-despacho"
                novalidate
            >

                <h2>Datos de despacho</h2>

                <div class="row g-3">

                    <div class="col-12">
                        <label for="desp-nombre" class="form-label">Nombre completo</label>
                        <input type="text" class="form-control" id="desp-nombre"
                               autocomplete="name" required>
                    </div>

                    <div class="col-md-8">
                        <label for="desp-direccion" class="form-label">Dirección</label>
                        <input type="text" class="form-control" id="desp-direccion"
                               autocomplete="street-address" placeholder="Calle, número, depto." required>
                    </div>

                    <div class="col-md-4">
                        <label for="desp-comuna" class="form-label">Comuna</label>
                        <input type="text" class="form-control" id="desp-comuna">
                    </div>

                    <div class="col-12">
                        <label for="desp-telefono" class="form-label">Teléfono</label>
                        <input type="tel" class="form-control" id="desp-telefono"
                               autocomplete="tel" placeholder="+56 9 1234 5678" required>
                    </div>

                    <div class="col-12">
                        <label for="desp-notas" class="form-label">Notas (opcional)</label>
                        <textarea class="form-control" id="desp-notas" rows="2" maxlength="300"
                                  placeholder="Ej: tocar el timbre 2 veces"></textarea>
                    </div>

                </div>

                <div id="mensaje-despacho" class="mt-3" role="alert"></div>

                <button type="submit" class="btn btn-danger btn-lg w-100 mt-3" id="btn-confirmar">
                    Confirmar pedido
                </button>

            </form>

            <div class="botones-pedido">

                <button
                    class="btn btn-outline-danger"
                    onclick="vaciarPedido()"
                >
                    Vaciar pedido
                </button>


                <a
                    href="cortes.html"
                    class="btn btn-danger"
                >
                    Seguir comprando
                </a>

            </div>

        </div>

    </main>



    <!-- ====================================== -->
    <!-- FOOTER -->
    <!-- ====================================== -->

    <footer class="pie-pagina">

        <div>

            <h2>
                Ubicación
            </h2>

            <p>
                Av. Ejemplo 1234, Santiago
            </p>

        </div>


        <div>

            <h2>
                Contacto
            </h2>

            <p>
                +56 9 1234 5678
            </p>

            <p>
                elasador2026@gmail.com
            </p>

        </div>


        <div>

            <h2>
                Redes sociales
            </h2>

            <p>
                Instagram
            </p>

            <p>
                Facebook
            </p>

        </div>

    </footer>



    <!-- ====================================== -->
    <!-- BOOTSTRAP -->
    <!-- ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- ====================================== -->
    <!-- PEDIDO -->
    <!-- ====================================== -->

    <script src="./assets/js/pedido.js"></script>

    <!-- ACCESO (registro / login) -->
    <script src="./assets/js/auth.js"></script>


    <!-- ====================================== -->
    <!-- HEADER STICKY + LÍNEA AL HACER SCROLL -->
    <!-- ====================================== -->

    <script>

        const header =
            document.getElementById(
                "headerPrincipal"
            );


        function actualizarHeader() {

            if (window.scrollY > 40) {

                header.classList.add(
                    "header-scroll"
                );

            } else {

                header.classList.remove(
                    "header-scroll"
                );

            }

        }


        window.addEventListener(
            "scroll",
            actualizarHeader
        );


        actualizarHeader();

    </script>


</body>

</html>
