<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pedido - El Asador</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet"
    >


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="./assets/css/estilos.css"
    >

</head>


<body>


    <!-- ====================================== -->
    <!-- HEADER -->
    <!-- ====================================== -->

    <header
        class="encabezado encabezado-interno"
        id="headerPrincipal"
    >

        <div class="logo">

            <a href="index.html">

                <img
                    src="./assets/imagenes_productos/logo minimalista.png"
                    alt="Logo El Asador"
                    class="logo-imagen"
                >

            </a>

        </div>


        <nav class="menu-navegacion">

            <a href="index.html">
                INICIO
            </a>

            <span>|</span>

            <a href="cortes.html">
                CORTES
            </a>

            <span>|</span>

            <a href="parrillas.html">
                PARRILLAS
            </a>

            <span>|</span>

            <a href="index.html#nosotros">
                LA CASA
            </a>

        </nav>


        <div class="acciones-header">

            <a
                href="pedido.html"
                class="btn btn-outline-light"
            >
                🛒 Pedido
                (<span id="contador-pedido">0</span>)
            </a>


            <button
                type="button"
                class="btn btn-outline-danger"
                data-bs-toggle="modal"
                data-bs-target="#myModal"
            >
                Acceder
            </button>

        </div>

    </header>



    <!-- ====================================== -->
    <!-- PEDIDO -->
    <!-- ====================================== -->

    <main class="seccion pedido-contenedor">

        <h1 class="titulo-seccion">
            Tu Pedido
        </h1>


        <div id="lista-pedido">
        </div>


        <div class="resumen-pedido">

            <p>
                Subtotal:

                <strong id="subtotal-pedido">
                    $0
                </strong>
            </p>


            <hr>


            <p class="total-pedido">
                Total:

                <strong id="total-pedido">
                    $0
                </strong>
            </p>


            <div class="botones-pedido">

                <button
                    class="btn btn-outline-danger"
                    onclick="vaciarPedido()"
                >
                    Vaciar pedido
                </button>


                <a
                    href="cortes.html"
                    class="btn btn-danger"
                >
                    Seguir comprando
                </a>

            </div>

        </div>

    </main>



    <!-- ====================================== -->
    <!-- FOOTER -->
    <!-- ====================================== -->

    <footer class="pie-pagina">

        <div>

            <h2>
                Ubicación
            </h2>

            <p>
                Av. Ejemplo 1234, Santiago
            </p>

        </div>


        <div>

            <h2>
                Contacto
            </h2>

            <p>
                +56 9 1234 5678
            </p>

            <p>
                elasador2026@gmail.com
            </p>

        </div>


        <div>

            <h2>
                Redes sociales
            </h2>

            <p>
                Instagram
            </p>

            <p>
                Facebook
            </p>

        </div>

    </footer>



    <!-- ====================================== -->
    <!-- MODAL -->
    <!-- ====================================== -->

    <div
        class="modal fade"
        id="myModal"
        tabindex="-1"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Acceder
                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                    >
                    </button>

                </div>


                <div class="modal-body">

                    <input
                        type="email"
                        class="form-control mb-3"
                        placeholder="Correo electrónico"
                    >


                    <input
                        type="password"
                        class="form-control mb-3"
                        placeholder="Contraseña"
                    >


                    <button class="btn btn-danger">
                        Iniciar sesión
                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- ====================================== -->
    <!-- BOOTSTRAP -->
    <!-- ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- ====================================== -->
    <!-- PEDIDO -->
    <!-- ====================================== -->

    <script src="./assets/js/pedido.js"></script>


    <!-- ====================================== -->
    <!-- HEADER STICKY + LÍNEA AL HACER SCROLL -->
    <!-- ====================================== -->

    <script>

        const header =
            document.getElementById(
                "headerPrincipal"
            );


        function actualizarHeader() {

            if (window.scrollY > 40) {

                header.classList.add(
                    "header-scroll"
                );

            } else {

                header.classList.remove(
                    "header-scroll"
                );

            }

        }


        window.addEventListener(
            "scroll",
            actualizarHeader
        );


        actualizarHeader();

    </script>


</body>

</html>
