<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido - El Asador</title></head>
<body>
<script>
  const pedido = new URLSearchParams(location.search).get('pedido');
  const destino = new URL('pedido.html', location.href);
  if (/^[1-9]\d*$/.test(pedido || '')) destino.searchParams.set('pendiente', pedido);
  location.replace(destino.href);
</script>
<noscript><a href="pedido.html">Volver a Mi pedido</a></noscript>
</body></html>
