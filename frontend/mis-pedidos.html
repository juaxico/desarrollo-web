    <div class="logo">
        <a href="index.html" aria-label="El Asador - Inicio">
            <img src="./assets/imagenes_productos/logo minimalista.png"
                 alt="Logo El Asador" class="logo-imagen">
        </a>
    </div>

    <!-- En tablet y móvil se despliega la navegación con este botón. -->
    <button class="menu-toggle" type="button"
            aria-label="Abrir menú de navegación"
            aria-controls="panel-navegacion"
            aria-expanded="false">
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
    </button>

    <div class="panel-navegacion" id="panel-navegacion">
        <nav class="menu-navegacion" aria-label="Navegación principal">
            <a href="index.html">INICIO</a>
            <span aria-hidden="true">|</span>
            <a href="cortes.html">CORTES</a>
            <span aria-hidden="true">|</span>
            <a href="parrillas.html">PARRILLAS</a>
            <span aria-hidden="true">|</span>
            <a href="index.html#nosotros">LA CASA</a>
        </nav>

        <!-- Mantener esta clase: auth.js añade aquí el acceso o el usuario. -->
        <div class="acciones-header">
            <a href="pedido.html" class="btn btn-outline-light">
                🛒 Pedido (<span id="contador-pedido">0</span>)
            </a>
            <button type="button" class="btn btn-outline-danger"
                    data-bs-toggle="modal" data-bs-target="#myModal">
                Acceder
            </button>
        </div>
    </div>

 <a href="pedido.html" class="btn btn-outline-danger mb-3">Volver al carrito</a>
 <div id="estado-historial" class="alert alert-info" role="status"></div>
 <div id="lista-historial"></div>
 <section id="detalle-historial" aria-live="polite"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
