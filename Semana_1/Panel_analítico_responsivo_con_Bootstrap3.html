<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Analítico</title>
    <!-- Conexión a Bootstrap 3 -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            
            <nav class="col-xs-12 col-sm-4 col-lg-3" aria-label="Navegacion principal">
                <h2>Panel</h2>
                <ul class="nav nav-pills nav-stacked">
                    <li class="active"><a href="#resumen">Resumen</a></li>
                    <li><a href="#ventas">Ventas</a></li>
                    <li><a href="#clientes">Clientes</a></li>
                </ul>
            </nav>

            <main class="col-xs-12 col-sm-8 col-lg-9" id="contenido">
                <header class="page-header">
                    <h1>Resumen ejecutivo</h1>
                </header>

                <section class="row" aria-label="Indicadores principales">
                    <article class="col-xs-12 col-md-6 col-lg-3">
                        <div class="panel panel-default">
                            <div class="panel-heading">Ventas</div>
                            <div class="panel-body">$ 12.500.000</div>
                        </div>
                    </article>
                    <article class="col-xs-12 col-md-6 col-lg-3">
                        <div class="panel panel-default">
                            <div class="panel-heading">Pedidos</div>
                            <div class="panel-body">1.248</div>
                        </div>
                    </article>
                    <article class="col-xs-12 col-md-6 col-lg-3">
                        <div class="panel panel-default">
                            <div class="panel-heading">Conversion</div>
                            <div class="panel-body">3,8%</div>
                        </div>
                    </article>
                    <article class="col-xs-12 col-md-6 col-lg-3">
                        <div class="panel panel-default">
                            <div class="panel-heading">Incidentes</div>
                            <div class="panel-body">2</div>
                        </div>
                    </article>
                </section>

                <section class="table-responsive" aria-labelledby="tabla-titulo">
                    <h2 id="tabla-titulo">Ultimas transacciones</h2>
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Cliente</th>
                                <th>Estado</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>05-08-2026</td>
                                <td>Cliente A</td>
                                <td>Confirmada</td>
                                <td>$ 120.000</td>
                            </tr>
                        </tbody>
                    </table>
                </section>
                
            </main>
        </div>
    </div>
</body>
</html>
